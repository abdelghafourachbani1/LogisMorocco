version: '3.8'

services:
  # Laravel Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logismaghreb-backend
    restart: always
    environment:
      APP_NAME: "LogisMaghreb"
      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: "mysql"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_DATABASE: "logismaghreb"
      DB_USERNAME: "logismaghreb_user"
      DB_PASSWORD: "secure_password_change_me"
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - logismaghreb-network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8000"
    container_name: logismaghreb-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - logismaghreb-network

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: logismaghreb-db
    restart: always
    environment:
      MYSQL_DATABASE: "logismaghreb"
      MYSQL_USER: "logismaghreb_user"
      MYSQL_PASSWORD: "secure_password_change_me"
      MYSQL_ROOT_PASSWORD: "root_password_change_me"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - logismaghreb-network

networks:
  logismaghreb-network:
    driver: bridge

volumes:
  mysql_data:
