<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock E-Commerce Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-6">

    <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-xl space-y-6 border border-gray-100">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-black text-gray-900">My External Store</h1>
            <p class="text-xs font-semibold text-gray-500">This is a mock store to test the LogisMaghreb API Integration.</p>
        </div>

        <div class="space-y-4">
            <!-- API Key -->
            <div class="space-y-1">
                <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Your LogisMaghreb API Key</label>
                <input id="api_key" type="password" placeholder="Paste your API key here..." class="w-full border border-gray-200 rounded-xl px-4 py-3 text-xs font-semibold focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 bg-gray-50" />
            </div>

            <hr class="border-gray-100 my-4" />

            <!-- Checkout Form -->
            <h2 class="text-sm font-extrabold text-gray-900">Checkout Details</h2>
            
            <div class="space-y-1">
                <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Customer Name</label>
                <input id="customer_name" type="text" value="Zayd TestCustomer" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-xs font-semibold focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500" />
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Phone Number</label>
                <input id="customer_phone" type="text" value="0600112233" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-xs font-semibold focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500" />
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Address</label>
                <input id="customer_address" type="text" value="Route 44, Maarif, Casablanca" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-xs font-semibold focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500" />
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Cash on Delivery (MAD)</label>
                <input id="amount_cod" type="number" value="350.00" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-xs font-black text-gray-900 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 bg-orange-50/50" />
            </div>

            <button id="submitBtn" onclick="sendOrder()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold text-sm py-4 rounded-xl transition-all duration-200 shadow-md shadow-orange-500/20 mt-4 flex justify-center items-center gap-2">
                Send Order to LogisMaghreb
            </button>
        </div>

        <div id="responseBox" class="hidden p-4 rounded-xl text-xs font-semibold border mt-4 break-words">
        </div>
    </div>

    <script>
        async function sendOrder() {
            const apiKey = document.getElementById('api_key').value.trim();
            const btn = document.getElementById('submitBtn');
            const responseBox = document.getElementById('responseBox');
            
            if(!apiKey) {
                alert("Please paste your API Key first!");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = "Processing...";
            responseBox.classList.add('hidden');

            const orderData = {
                customer_name: document.getElementById('customer_name').value,
                customer_phone: document.getElementById('customer_phone').value,
                customer_address: document.getElementById('customer_address').value,
                city: "Casablanca",
                amount_cod: parseFloat(document.getElementById('amount_cod').value),
                delivery_notes: "API test from Mock Store"
            };

            // Get CSRF Token from cookies (since we are testing on localhost:3000)
            const getCookie = (name) => {
                const value = `; ${document.cookie}`;
                const parts = value.split(`; ${name}=`);
                if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
                return '';
            };
            const csrfToken = getCookie('XSRF-TOKEN');

            try {
                const response = await fetch("http://127.0.0.1:8000/api/v1/orders", {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json",
                        "Authorization": "Bearer " + apiKey,
                        "X-XSRF-TOKEN": csrfToken
                    },
                    body: JSON.stringify(orderData)
                });

                const data = await response.json();

                responseBox.classList.remove('hidden');
                if (response.ok) {
                    responseBox.className = "p-4 rounded-xl text-xs font-semibold border mt-4 break-words bg-green-50 text-green-700 border-green-200";
                    responseBox.innerHTML = `<strong>Success! Order Created!</strong><br><br>Tracking Number: ${data.data.tracking_number}<br>Check your dashboard!`;
                } else {
                    responseBox.className = "p-4 rounded-xl text-xs font-semibold border mt-4 break-words bg-red-50 text-red-700 border-red-200";
                    responseBox.innerHTML = `<strong>Error!</strong><br><br>${data.message || "Invalid API Key or data."}`;
                }
            } catch (err) {
                responseBox.classList.remove('hidden');
                responseBox.className = "p-4 rounded-xl text-xs font-semibold border mt-4 break-words bg-red-50 text-red-700 border-red-200";
                responseBox.innerHTML = `<strong>Network Error!</strong><br><br>Make sure your Laravel server is running on http://127.0.0.1:8000`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = "Send Order to LogisMaghreb";
            }
        }
    </script>
</body>
</html>
